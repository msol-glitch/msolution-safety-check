<title>집진기 청소 점검 | ㈜엠솔루션</title>
<style>
  :root{
    --navy:#1B3A6B; --navy-d:#0F172A; --bg:#F1F5F9; --card:#FFFFFF; --line:#E2E8F0;
    --text:#0F172A; --sub:#64748B; --ok:#1D4ED8; --warn:#C2410C; --warn-bg:#FFF1E8;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo",system-ui,sans-serif;font-size:16px;line-height:1.45}
  header{background:linear-gradient(135deg,var(--navy-d),var(--navy));color:#fff;padding:18px 16px 20px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.02em}
  .mark{width:52px;height:38px;display:grid;place-items:center}
  .mark img{width:100%;height:100%;object-fit:contain}
  .brand small{display:block;font-weight:400;opacity:.75;font-size:12px}
  h1{margin:14px 0 4px;font-size:21px}
  .doc{font-size:12px;opacity:.7}
  .eq{display:inline-block;margin-top:10px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);
    padding:6px 12px;border-radius:999px;font-weight:700}
  main{max-width:560px;margin:0 auto;padding:14px 16px 120px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 14px 6px;margin-bottom:12px}
  .card h2{margin:0 0 8px;font-size:16px;display:flex;justify-content:space-between;align-items:center}
  .tag{font-size:11px;font-weight:700;color:var(--warn);background:var(--warn-bg);padding:3px 8px;border-radius:999px}
  .count{font-size:12px;color:var(--sub);font-weight:400}
  label.item{display:flex;align-items:center;gap:12px;padding:12px 2px;border-top:1px solid var(--line);cursor:pointer;min-height:52px}
  label.item:first-of-type{border-top:0}
  label.item input{position:absolute;opacity:0;pointer-events:none}
  .box{flex:none;width:26px;height:26px;border:2px solid #94A3B8;border-radius:7px;display:grid;place-items:center;transition:.15s}
  .box svg{width:16px;height:16px;opacity:0}
  label.item input:checked + .box{background:var(--navy);border-color:var(--navy)}
  label.item input:checked + .box svg{opacity:1}
  label.item input:checked ~ span{color:var(--navy);font-weight:700}
  input[type=text],select,textarea{width:100%;font:inherit;padding:12px;border:1px solid #CBD5E1;border-radius:10px;background:#fff;margin-bottom:10px}
  textarea{min-height:80px;resize:vertical}
  .seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
  .seg button{font:inherit;padding:12px;border-radius:10px;border:1px solid #CBD5E1;background:#fff;font-weight:700;color:var(--sub)}
  .seg button.on.ok{background:#DBEAFE;border-color:var(--ok);color:var(--ok)}
  .seg button.on.bad{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
  .bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
  .bar .in{max-width:560px;margin:0 auto}
  .submit{width:100%;font:inherit;font-weight:700;font-size:17px;color:#fff;background:var(--navy);border:0;border-radius:12px;padding:15px}
  .submit:disabled{background:#94A3B8}
  .msg{font-size:13px;color:var(--warn);margin:0 0 8px;min-height:0}
  .done{display:none;text-align:center;padding:48px 20px}
  .done .ic{width:72px;height:72px;border-radius:50%;background:#DBEAFE;color:var(--ok);display:grid;place-items:center;margin:0 auto 16px}
  .done h2{margin:0 0 6px}
  .done p{color:var(--sub);margin:4px 0}
  footer{text-align:center;color:var(--sub);font-size:11px;padding:6px 0 0}
</style>
</head>

const EQUIPMENTS = ['집진기 KA4', '집진기 GN7'];
const SECTIONS = [
  ['A', 'A. 청소 전 안전조치', true, ['집진기 운전 정지 확인','전원 차단 및 잠금·표지(LOTO) 부착','보호구 착용 (방진마스크, 보안경, 장갑)']],
  ['B', 'B. 청소 작업', false, ['필터 분진 털기·제거','분진함(호퍼) 비움','흡입구·덕트 분진 퇴적 제거','집진기 외부와 주변 바닥 분진 청소','차압계 정상 범위 확인']],
  ['C', 'C. 화재예방 확인', false, ['주변에 가연물·인화물 없음','소화기 비치, 압력 게이지 정상','접지선 연결 상태 양호','이상 냄새·과열·스파크 흔적 없음','수거한 분진을 지정 장소에 보관']],
  ['D', 'D. 마무리', false, ['전원 복구 후 정상 가동 확인']]
];
const $ = id => document.getElementById(id);
const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';

// 설비: QR 주소의 ?eq=1 / ?eq=2
let eq = EQUIPMENTS[parseInt(new URLSearchParams(location.search).get('eq'), 10) - 1] || '';
const sel = $('eqSel');
EQUIPMENTS.forEach(v => sel.insertAdjacentHTML('beforeend', `<option>${v}</option>`));
function showEq(){ $('eqBadge').textContent = eq || '설비 선택 필요'; }
if (!eq) { $('eqCard').style.display = ''; }
sel.onchange = () => { eq = sel.value; showEq(); };
showEq();

// 체크 항목
$('sections').innerHTML = SECTIONS.map(([k, title, req, items]) => `
  <div class="card" data-sec="${k}">
    <h2>${title} ${req ? '<span class="tag">필수 · 모두 체크</span>' : `<span class="count" id="cnt${k}">0/${items.length}</span>`}</h2>
    ${items.map(t => `<label class="item"><input type="checkbox" value="${t}"><span class="box">${CHECK}</span><span>${t}</span></label>`).join('')}
  </div>`).join('');
document.querySelectorAll('[data-sec]').forEach(card => card.addEventListener('change', () => {
  const c = card.querySelector('.count');
  if (c) c.textContent = card.querySelectorAll('input:checked').length + '/' + card.querySelectorAll('input').length;
}));

// 특이사항
let issue = '없음';
document.querySelectorAll('.seg button').forEach(b => b.onclick = () => {
  document.querySelectorAll('.seg button').forEach(x => x.classList.remove('on'));
  b.classList.add('on'); issue = b.dataset.v;
  $('memo').style.display = issue === '이상 있음' ? '' : 'none';
});

// 작업자 이름 기억 (이 휴대폰에서만)
try { $('worker').value = localStorage.getItem('ms_worker') || ''; } catch (e) {}

function picked(k){ return [...document.querySelectorAll(`[data-sec="${k}"] input:checked`)].map(i => i.value); }

$('submit').onclick = async () => {
  const msg = $('msg'); msg.textContent = '';
  const worker = $('worker').value.trim();
  if (!eq) return msg.textContent = '설비를 선택해 주세요.';
  if (!worker) { $('worker').focus(); return msg.textContent = '작업자 이름을 입력해 주세요.'; }
  if (picked('A').length !== SECTIONS[0][3].length) return msg.textContent = 'A. 청소 전 안전조치 3개를 모두 확인해야 제출됩니다.';
  if (issue === '이상 있음' && !$('memo').value.trim()) { $('memo').focus(); return msg.textContent = '이상 내용을 적어주세요.'; }

  const btn = $('submit'); btn.disabled = true; btn.textContent = '저장 중…';
  try {
    const res = await fetch(ENDPOINT, { method: 'POST', body: JSON.stringify({
      key: API_KEY, eq, worker, A: picked('A'), B: picked('B'), C: picked('C'), D: picked('D'),
      issue, memo: $('memo').value.trim() }) });
    const out = await res.json();
    if (!out.ok) throw new Error(out.error || '저장 실패');
    try { localStorage.setItem('ms_worker', worker); } catch (e) {}
    $('form').style.display = 'none'; $('bar').style.display = 'none';
    $('doneInfo').textContent = `${eq} · ${worker} · ${out.time}`;
    $('done').style.display = 'block'; scrollTo(0, 0);
  } catch (e) {
    msg.textContent = '저장되지 않았습니다. 인터넷 연결을 확인하고 다시 눌러주세요. (' + e.message + ')';
    btn.disabled = false; btn.textContent = '다시 제출';
  }
};
</script>
</body>
</html>
