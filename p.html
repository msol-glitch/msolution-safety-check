  .barbtns{display:grid;grid-template-columns:1fr 2fr;gap:8px}
  .allok{font:inherit;font-weight:700;font-size:15px;border:2px solid var(--ok);color:var(--ok);background:#fff;border-radius:12px;cursor:pointer}
  .note{display:none;margin-top:8px}

  .note textarea{border-color:var(--bad);background:#FFFBF8}
  .etc{margin:4px 0 10px}
  .who{display:grid;gap:8px}

  .who small{color:var(--sub)}

  .row{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:13px;color:var(--sub)}
  .lnk{font:inherit;font-size:13px;background:none;border:0;color:var(--ok);text-decoration:underline;cursor:pointer;padding:0}

  .submit{width:100%;font:inherit;font-weight:700;font-size:17px;color:#fff;background:var(--navy);border:0;border-radius:12px;padding:14px;cursor:pointer}
  .submit:disabled{background:#94A3B8}
  .msg{font-size:13px;color:var(--bad);margin:0 0 6px}
  .done{display:none;text-align:center;padding:48px 20px}
  .done .ic{width:72px;height:72px;border-radius:50%;background:var(--ok-bg);color:var(--ok);display:grid;place-items:center;margin:0 auto 16px}
  .done p{color:var(--sub);margin:4px 0}
  .done button{margin-top:18px}
  .back{font:inherit;font-size:14px;background:none;border:0;color:#fff;opacity:.85;padding:0;margin-top:8px;cursor:pointer;text-decoration:underline}
  dialog{border:0;border-radius:16px;padding:0;max-width:440px;width:calc(100% - 32px)}
  dialog::backdrop{background:rgba(15,23,42,.55)}
  .dh{background:var(--navy);color:#fff;padding:14px 16px;font-weight:700}
  .db{padding:14px 16px}
  .db .lw{background:#EFF6FF;border-left:4px solid var(--ok);padding:10px 12px;border-radius:6px;font-weight:700;color:var(--navy);margin-bottom:10px}
  .db p{margin:6px 0;font-size:14px}
  .db small{color:var(--sub);font-size:12px}
  .df{padding:0 16px 16px}
  .df button{width:100%;font:inherit;font-weight:700;padding:12px;border:0;border-radius:10px;background:var(--navy);color:#fff}
</style>

  ['소방', [
    ['f1', '소화기구 설치 및 매월 점검 실시 여부', `${RULE} 제243조 (소화설비)`, '소화기가 정위치에 있고 압력 정상, 월 점검표가 기록되어 있는지'],
    ['f2', '피난안내도 설치 및 비상통로 관리 여부', `${RULE} 제18조 (비상구 등의 유지)`, '피난안내도가 게시되고 비상구·비상통로가 막혀 있지 않은지'],
    ['f3', '소화전 관리 상태', `${RULE} 제243조 (소화설비)`, '소화전 앞에 적치물이 없고 함 내부 장비가 갖춰져 있는지']
  ]],
  ['산업용 로봇', [
    ['r1', '작업안전수칙 준수 여부', `${LAW} 제38조 (안전조치) · ${RULE} 제222조 (산업용 로봇의 교시 등 작업)`, '로봇 작업 안전수칙이 게시되고 작업자가 지키는지'],
    ['r2', '비정형 작업 시 LOTO 절차 진행 여부', `${LAW} 제38조 (안전조치) · ${RULE} 제222조 (산업용 로봇의 교시 등 작업)`, '정비·이물 제거 등 비정형 작업 때 전원 차단·잠금·표지를 하는지'],
    ['r3', '방호장치 점검 유무 (시업 전 오작동 확인 후 작업)', `${RULE} 제223조 (운전 중 위험 방지)`, '작업 시작 전 방책·센서·비상정지 작동을 확인했는지'],
    ['r4', '로봇 작동 시 작업공간 내 불필요 인원 출입통제 여부', `${RULE} 제223조 (운전 중 위험 방지)`, '로봇 작동 범위에 불필요한 사람이 들어가지 않도록 통제하는지']
  ]],
  ['지게차', [
    ['k1', '지게차 속도 준수 여부', `${RULE} 제98조 (제한속도의 지정 등) — 법적준수 항목표 추가 반영, 조문 재확인 대상`, '구내 제한속도를 지키는지, 속도 표지가 있는지'],
    ['k2', '지게차 작업자 안전벨트 착용 준수 여부', `${RULE} 제183조 (좌석 안전띠의 착용 등)`, '운전자가 안전벨트를 착용하는지'],
    ['k3', '지게차 시동키 관리 준수 여부', `${RULE} 제99조 (운전위치 이탈 시의 조치)`, '운전석을 떠날 때 시동키를 빼서 관리하는지']
  ]]
];
const FIVE = [
  ['A. 3정 – 자재·제품 관리', [
    ['a1', '정품: 해당 차종 부품만 있음 (이종품 혼입 없음)'], ['a2', '정량: 지정 수량·적재 단수 준수'],
    ['a3', '정위치: 지정 구역·표시선 안에 보관'], ['a4', '식별표: 부품·완제품 식별표(품번·LOT) 부착'],
    ['a5', '선입선출: 먼저 들어온 자재부터 사용']]],
  ['B. 5행 – 작업장 관리', [
    ['b1', '정리: 불필요한 물건·폐자재 없음'], ['b2', '정돈: 공구·지그·게이지 지정 위치'],
    ['b3', '청소: 작업대·설비·바닥 분진·이물 없음'], ['b4', '청결: 제품 닿는 면(작업대·지그·트레이) 오염 없음'],
    ['b5', '습관화: 작업표준서·한도견본 최신본 게시']]],
  ['C. 품질 관리', [
    ['c1', '부적합품 격리: 적색 박스·지정 구역 분리 및 표시'], ['c2', '검사구·게이지 상태 양호, 교정 라벨 유효'],
    ['c3', '납품 용기: PLT·트레이 청결, 제품 손상 없이 적재']]],
  ['D. 안전', [
    ['d1', '통로 확보: 통로·비상구·소화기 앞 적치물 없음'], ['d2', '소화기 정위치, 압력 게이지 정상'],
    ['d3', '전기: 배선 정리, 멀티탭 문어발 연결 없음'], ['d4', '바닥: 기름·물 미끄럼, 걸림 요소 없음'],
    ['d5', '보호구: 작업자 보호구 착용'], ['d6', '방호장치: 설비 안전커버·비상정지 정상'],
    ['d7', '화학물질: 용기 라벨 부착, MSDS 게시']]]
];
const DOCNO = { patrol: '중대재해예방 일일 점검 체크리스트 · 문서번호 MS-SF-05', '5s': '3정5행 점검표 · 문서번호 MS-SF-06' };
const INSPECTORS = [['이성희 과장', '안전관리자'], ['이민희 대표', '안전보건관리책임자']];

const $ = id => document.getElementById(id);
const store = { get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} } };
const today = () => new Date().toLocaleDateString('sv-SE', { timeZone: 'Asia/Seoul' });

let team = parseInt(new URLSearchParams(location.search).get('t'), 10);
if (!TEAMS[team]) team = 0;
let type = null, inspector = '', answers = {}, padDirty = false;

function showTeam() {
  $('teamBadge').textContent = team ? `${TEAMS[team][0]} · ${TEAMS[team][1]}` : '팀 선택 필요';
}
if (!team) {
  $('menu').insertAdjacentHTML('afterbegin', `<div class="card"><h2>팀 선택</h2><div class="who">${Object.entries(TEAMS).map(([k, v]) => `<button data-team="${k}"><b>${v[0]}</b> <small>${v[1]}</small></button>`).join('')}</div></div>`);
  document.querySelectorAll('[data-team]').forEach(b => b.onclick = () => {
    team = +b.dataset.team; showTeam();
    document.querySelectorAll('[data-team]').forEach(x => x.classList.toggle('on', x === b));
  });
}
showTeam();

document.querySelectorAll('[data-type]').forEach(b => b.onclick = () => {
  if (!team) { alertMsg('먼저 팀을 선택해 주세요.'); return; }
  open(b.dataset.type);
});
$('backBtn').onclick = () => { if (Object.keys(answers).length && !confirm('입력한 내용이 사라집니다. 돌아갈까요?')) return; reset(); };
$('again').onclick = () => { $('done').style.display = 'none'; $('main').style.display = ''; reset(); };

function alertMsg(t) { const m = document.createElement('div'); m.className = 'card'; m.style.color = 'var(--bad)'; m.textContent = t; $('menu').prepend(m); setTimeout(() => m.remove(), 2500); }

function reset() {
  type = null; answers = {};
  $('form').style.display = 'none'; $('bar').style.display = 'none'; $('menu').style.display = '';
  $('backBtn').style.display = 'none'; $('title').textContent = '현장 점검'; $('docno').textContent = '점검 종류를 선택하세요';
  scrollTo(0, 0);
}

function open(t) {
  type = t; answers = {};
  $('menu').style.display = 'none'; $('form').style.display = ''; $('bar').style.display = ''; $('backBtn').style.display = '';
  $('title').textContent = t === 'patrol' ? '중대재해예방 순회점검' : '3정5행 점검';
  $('docno').textContent = DOCNO[t];
  // 점검자
  if (t === 'patrol') {
    const last = store.get('ms_patrol_who') || '';
    $('who').innerHTML = `<div class="who">${INSPECTORS.map(([n, r]) => `<button data-who="${n}"><b>${n}</b> <small>${r}</small></button>`).join('')}<input type="text" id="whoEtc" maxlength="20" placeholder="그 외 점검자 이름 직접 입력"></div>`;
    document.querySelectorAll('[data-who]').forEach(b => b.onclick = () => setWho(b.dataset.who));
    $('whoEtc').oninput = e => setWho(e.target.value.trim(), true);
    if (last) { if (INSPECTORS.some(i => i[0] === last)) setWho(last); else { $('whoEtc').value = last; setWho(last, true); } }
  } else {
    $('who').innerHTML = `<input type="text" id="whoName" maxlength="20" placeholder="점검자 이름" value="${(store.get('ms_5s_who') || '').replace(/"/g, '')}">`;
    inspector = $('whoName').value.trim();
    $('whoName').oninput = e => { inspector = e.target.value.trim(); updateSign(); };
  }
  // 항목
  const groups = t === 'patrol' ? PATROL : FIVE;
  $('sections').innerHTML = `<div class="legend">항목을 누를 때마다 <b class="o">✓ 양호</b> → <b class="x">✗ 불량</b> → <b class="n">– 해당없음</b> 순서로 바뀝니다. 이상 없으면 <b class="o">[모두 양호]</b> 후 문제 있는 항목만 바꾸세요.</div>` +
    groups.map(([g, items], gi) => `
    <div class="card"><h2>${g} <span><span class="cnt" id="cnt${gi}">0/${items.length}</span> <button class="gall" data-gall="${gi}">모두 양호</button></span></h2>
      ${items.map(it => `<div class="it" data-id="${it[0]}" data-g="${gi}">
        <div class="q"><span class="mk"></span><div class="t">${it[1]}</div>${it[2] ? `<button class="law" data-law="${it[0]}">근거</button>` : ''}</div>
        <div class="note"><textarea maxlength="200" placeholder="불량 내용을 적어주세요 (필수)"></textarea></div>
      </div>`).join('')}
      ${t === 'patrol' ? `<div class="etc"><input type="text" maxlength="150" data-etc="${g}" placeholder="기타 (있을 때만)"></div>` : ''}
    </div>`).join('');
  const MARK = { O: '✓', X: '✗', NA: '–' }, NEXT = { '': 'O', O: 'X', X: 'NA', NA: 'O' };
  const setState = (el, v) => {
    el.classList.remove('s-O', 's-X', 's-NA'); if (v) el.classList.add('s-' + v);
    el.querySelector('.mk').textContent = MARK[v] || '';
    if (v) answers[el.dataset.id] = v; else delete answers[el.dataset.id];
    el.querySelector('.note').style.display = v === 'X' ? 'block' : 'none';
  };
  window.__setState = setState;
  document.querySelectorAll('.it').forEach(el => {
    el.querySelector('.q').onclick = e => { if (e.target.closest('.law')) return; setState(el, NEXT[answers[el.dataset.id] || '']); updateProg(); };
  });
  document.querySelectorAll('[data-gall]').forEach(b => b.onclick = () => {
    document.querySelectorAll(`.it[data-g="${b.dataset.gall}"]`).forEach(el => { if (!answers[el.dataset.id]) setState(el, 'O'); });
    updateProg();
  });
  document.querySelectorAll('[data-law]').forEach(b => b.onclick = () => showLaw(b.dataset.law));
  $('signCard').style.display = t === 'patrol' ? '' : 'none';
  if (t === 'patrol') { initPad(); updateSign(); }
  updateProg(); scrollTo(0, 0);
}

function setWho(n, fromInput) {
  inspector = n;
  document.querySelectorAll('[data-who]').forEach(b => b.classList.toggle('on', b.dataset.who === n));
  if (!fromInput && $('whoEtc')) $('whoEtc').value = '';
  updateSign();
}

function allItems() { return (type === 'patrol' ? PATROL : FIVE).flatMap(([g, items], gi) => items.map(it => ({ g, gi, id: it[0], label: it[1] }))); }
function updateProg() {
  const items = allItems();
  const done = items.filter(i => answers[i.id]).length;
  const bad = items.filter(i => answers[i.id] === 'X').length;
  $('prog').textContent = `${done} / ${items.length} 항목 체크${bad ? ` · 불량 ${bad}건` : ''}`;
  (type === 'patrol' ? PATROL : FIVE).forEach(([g, its], gi) => { const c = $('cnt' + gi); if (c) c.textContent = its.filter(i => answers[i[0]]).length + '/' + its.length; });
}

function showLaw(id) {
  for (const [g, items] of PATROL) for (const it of items) if (it[0] === id) {
    $('lawTitle').textContent = `${g} · ${it[1]}`; $('lawRef').textContent = it[2]; $('lawPoint').textContent = '점검 포인트: ' + it[3];
  }
  $('lawDlg').showModal();
}
$('lawClose').onclick = () => $('lawDlg').close();
$('allOk').onclick = () => { document.querySelectorAll('.it').forEach(el => { if (!answers[el.dataset.id]) window.__setState(el, 'O'); }); updateProg(); };

// ---------- 서명 ----------
let ctx, drawing = false;
function initPad() {
  const c = $('pad'), r = c.getBoundingClientRect(), ratio = Math.max(window.devicePixelRatio || 1, 1);
  c.width = r.width * ratio; c.height = r.height * ratio;
  ctx = c.getContext('2d'); ctx.scale(ratio, ratio);
  ctx.lineWidth = 2.6; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#0F172A';
  padDirty = false;
  const pos = e => { const b = c.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; };
  c.onpointerdown = e => { drawing = true; c.setPointerCapture(e.pointerId); ctx.beginPath(); ctx.moveTo(...pos(e)); };
  c.onpointermove = e => { if (!drawing) return; ctx.lineTo(...pos(e)); ctx.stroke(); padDirty = true; };
  c.onpointerup = c.onpointercancel = () => { drawing = false; };
}
$('clearPad').onclick = () => { const c = $('pad'); ctx.clearRect(0, 0, c.width, c.height); padDirty = false; };
$('resign').onclick = () => { $('signed').style.display = 'none'; $('padWrap').style.display = ''; initPad(); savedSign = null; };
let savedSign = null;
function signKey() { return `ms_sign_${today()}_${inspector}`; }
function updateSign() {
  if (type !== 'patrol') return;
  savedSign = inspector ? store.get(signKey()) : null;
  $('signed').style.display = savedSign ? 'flex' : 'none';
  $('padWrap').style.display = savedSign ? 'none' : '';
  if (savedSign) $('signedImg').src = savedSign;
}
function exportSign() {
  const c = $('pad'), w = 360, h = Math.round(w * c.height / c.width), o = document.createElement('canvas');
  o.width = w; o.height = h; const x = o.getContext('2d');
  x.fillStyle = '#fff'; x.fillRect(0, 0, w, h); x.drawImage(c, 0, 0, w, h);
  return o.toDataURL('image/png');
}

// ---------- 제출 ----------
$('submit').onclick = async () => {
  const msg = $('msg'); msg.textContent = '';
  if (!inspector) return msg.textContent = '점검자를 선택하거나 이름을 입력해 주세요.';
  const items = allItems();
  const miss = items.filter(i => !answers[i.id]);
  if (miss.length) { document.querySelector(`[data-id="${miss[0].id}"]`).scrollIntoView({ behavior: 'smooth', block: 'center' }); return msg.textContent = `체크하지 않은 항목이 ${miss.length}개 있습니다.`; }
  const rows = items.map(i => {
    const el = document.querySelector(`[data-id="${i.id}"]`);
    return { g: i.g, id: i.id, label: i.label, r: answers[i.id], note: answers[i.id] === 'X' ? el.querySelector('textarea').value.trim() : '' };
  });
  const noNote = rows.find(r => r.r === 'X' && !r.note);
  if (noNote) { document.querySelector(`[data-id="${noNote.id}"] textarea`).focus(); return msg.textContent = '불량 항목은 내용을 꼭 적어주세요.'; }
  let sign = '';
  if (type === 'patrol') {
    sign = savedSign || (padDirty ? exportSign() : '');
    if (!sign) { $('signCard').scrollIntoView({ behavior: 'smooth' }); return msg.textContent = '서명해 주세요.'; }
  }
  const etc = {}; document.querySelectorAll('[data-etc]').forEach(e => { if (e.value.trim()) etc[e.dataset.etc] = e.value.trim(); });
  const btn = $('submit'); btn.disabled = true; btn.textContent = '저장 중…';
  try {
    const res = await fetch(ENDPOINT, { method: 'POST', body: JSON.stringify({ key: API_KEY, type, team, inspector, items: rows, etc, sign }) });
    const out = await res.json();
    if (!out.ok) throw new Error(out.error || '저장 실패');
    if (type === 'patrol') { store.set('ms_patrol_who', inspector); if (!savedSign) store.set(signKey(), sign); } else store.set('ms_5s_who', inspector);
    const bad = rows.filter(r => r.r === 'X').length;
    $('main').style.display = 'none'; $('bar').style.display = 'none';
    $('doneInfo').textContent = `${TEAMS[team][0]} · ${type === 'patrol' ? '순회점검' : '3정5행'} · ${inspector} · ${out.time}`;
    $('doneBad').textContent = bad ? `불량 ${bad}건이 조치 목록에 등록되었습니다.` : '불량 없음';
    $('done').style.display = 'block'; scrollTo(0, 0);
  } catch (e) {
    msg.textContent = '저장되지 않았습니다. 인터넷 연결을 확인하고 다시 눌러주세요. (' + e.message + ')';
  } finally { btn.disabled = false; btn.textContent = '제출'; }
};
</script>
</body>
</html>
