<title>점검 기록 보기 | ㈜엠솔루션</title>
<style>
  @page{size:A4;margin:12mm}
  :root{--navy:#1B3A6B;--line:#CBD5E1;--sub:#64748B;--ok:#1D4ED8;--bad:#C2410C}
  body{margin:0;background:#F1F5F9;color:#0F172A;font-family:"Malgun Gothic","맑은 고딕",system-ui,sans-serif;font-size:14px}
  .tool{max-width:820px;margin:16px auto;background:#fff;border:1px solid #E2E8F0;border-radius:12px;padding:14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .tool label{font-size:13px;color:var(--sub)}
  .tool input,.tool select{font:inherit;padding:8px;border:1px solid var(--line);border-radius:8px}
  .tool button{font:inherit;font-weight:700;padding:9px 14px;border:0;border-radius:8px;background:var(--navy);color:#fff;cursor:pointer}
  .tool .ghost{background:#E2E8F0;color:#0F172A}
  #msg{width:100%;color:var(--bad);font-size:13px;margin:0}
  .sheet{max-width:820px;margin:0 auto 16px;background:#fff;border:1px solid #E2E8F0;padding:18px 20px;page-break-after:always}
  .hd{display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid var(--navy);padding-bottom:8px}
  .hd img{height:30px} .hd .r{text-align:right;font-size:12px;color:var(--sub)}
  h2{margin:10px 0 8px;font-size:19px;text-align:center}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th,td{border:1px solid var(--line);padding:5px 6px;vertical-align:middle}
  th{background:#1E293B;color:#fff}
  .meta th{background:#F1F5F9;color:#0F172A;width:16%}
  .c{text-align:center} .g{background:#F8FAFC;font-weight:700;text-align:center;width:13%}
  .O{color:var(--ok);font-weight:700} .X{color:var(--bad);font-weight:700;background:#FFF1E8} .NA{color:var(--sub)}
  .sign img{height:52px}
  .foot{margin-top:8px;font-size:11px;color:var(--sub)}
  .empty{max-width:820px;margin:20px auto;text-align:center;color:var(--sub)}
  @media print{body{background:#fff}.tool{display:none}.sheet{border:0;margin:0;padding:0}}
</style>
</head>
<body>
<div class="tool">
  <label>날짜 <input type="date" id="date"></label>
  <label>종류 <select id="type"><option value="patrol">중대재해예방 순회점검</option><option value="5s">3정5행 점검</option></select></label>
  <label>관리자 PIN <input type="password" id="pin" inputmode="numeric" maxlength="8" size="6"></label>
  <button id="load">불러오기</button>
  <button class="ghost" id="print">인쇄</button>
  <p id="msg"></p>
</div>
<div id="out"></div>

const TEAMS = { 1: '조립1팀', 2: '조립2팀', 3: '조립3팀', 4: '도장팀' };
const R = { O: '양호', X: '불량', NA: '해당없음' };
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
$('date').value = new Date().toLocaleDateString('sv-SE', { timeZone: 'Asia/Seoul' });
try { $('pin').value = sessionStorage.getItem('ms_pin') || ''; } catch (e) {}
$('print').onclick = () => print();
$('load').onclick = async () => {
  const msg = $('msg'); msg.textContent = '불러오는 중…'; $('out').innerHTML = '';
  try {
    const u = `${ENDPOINT}?action=report&date=${encodeURIComponent($('date').value)}&type=${$('type').value}&pin=${encodeURIComponent($('pin').value)}`;
    const d = await (await fetch(u)).json();
    if (!d.ok) throw new Error(d.error || '불러오기 실패');
    try { sessionStorage.setItem('ms_pin', $('pin').value); } catch (e) {}
    msg.textContent = d.records.length ? `${d.records.length}건` : '';
    if (!d.records.length) { $('out').innerHTML = '<p class="empty">해당 날짜에 기록이 없습니다.</p>'; return; }
    $('out').innerHTML = d.records.map(r => sheet(r, d.type, d.docno)).join('');
  } catch (e) { msg.textContent = e.message; }
};
function sheet(r, type, docno) {
  const groups = [];
  r.items.forEach(it => { let g = groups.find(x => x.g === it.g); if (!g) groups.push(g = { g: it.g, items: [] }); g.items.push(it); });
  const body = groups.map(g => g.items.map((it, i) => `<tr>${i === 0 ? `<td class="g" rowspan="${g.items.length + (r.etc && r.etc[g.g] ? 1 : 0)}">${esc(g.g)}</td>` : ''}
    <td>${esc(it.label)}</td><td class="c ${it.r}">${R[it.r] || ''}</td><td>${esc(it.note)}</td></tr>`).join('') +
    (r.etc && r.etc[g.g] ? `<tr><td>기타</td><td class="c">-</td><td>${esc(r.etc[g.g])}</td></tr>` : '')).join('');
  const title = type === 'patrol' ? '중대재해예방 일일 점검 체크리스트' : '3정5행 점검표';
  return `<div class="sheet">
    <div class="hd"><img src="${LOGO}" alt="㈜엠솔루션"><div class="r">안전보건팀<br>${esc(docno)}</div></div>
    <h2>${title}</h2>
    <table class="meta"><tr><th>사업장명</th><td>㈜엠솔루션</td><th>점검 구역</th><td>${esc(TEAMS[r.team] || r.team)}</td></tr>
      <tr><th>점검 일시</th><td>${esc(r.time)}</td><th>점검자</th><td>${esc(r.inspector)}${r.sign ? `<div class="sign"><img src="${r.sign}" alt="서명"></div>` : ''}</td></tr></table>
    <div style="height:8px"></div>
    <table><tr><th>구분</th><th>점검사항</th><th style="width:10%">결과</th><th style="width:30%">비고 (불량 내용)</th></tr>${body}</table>
    <div class="foot">※ 본 문서는 QR 전자 점검기록(제출 시각 서버 자동 기록, 점검자 전자서명)을 출력한 것이며 원본은 회사 구글 시트에 보관됨 · 출력일시 ${new Date().toLocaleString('ko-KR')}</div>
  </div>`;
}
</script>
</body>
</html>
