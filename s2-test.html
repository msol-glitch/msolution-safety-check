<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>엠솔루션 안전 참여 현황</title>
<style>
:root{--navy:#1B3A6B;--ink:#0F172A;--sub:#64748B;--line:#E2E8F0;--or:#EA580C;--bl:#1D4ED8}
*{box-sizing:border-box}body{margin:0;background:#F1F5F9;font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;color:var(--ink)}
.tb{background:#FDF0D8;color:#A86200;font-weight:700;font-size:13px;text-align:center;padding:6px}
header{background:#0F172A;color:#fff;padding:16px 16px 18px}
.br{display:flex;align-items:center;gap:10px}.br img{height:34px;background:#fff;border-radius:6px;padding:2px}
.br b{font-size:17px}.br small{display:block;color:#94A3B8;font-size:12px;font-weight:400}
main{max-width:520px;margin:0 auto;padding:12px 14px 30px}
.hero{background:linear-gradient(135deg,#1E293B,#1B3A6B);color:#fff;border-radius:16px;padding:18px;text-align:center;margin-top:-6px}
.hero .n{font-size:44px;font-weight:900;color:#FDBA74;line-height:1.15}.hero .l{font-size:13px;color:#CBD5E1}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.k{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 4px;text-align:center}
.k .v{font-size:22px;font-weight:800}.k .t{font-size:11px;color:var(--sub);line-height:1.35}
.sec{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:10px}
.sec h3{margin:0 0 8px;font-size:15px;display:flex;justify-content:space-between;align-items:baseline}.sec h3 small{font-size:11.5px;color:var(--sub);font-weight:400}
.it{display:flex;gap:8px;padding:9px 0;border-top:1px solid #F1F5F9;font-size:14px;align-items:flex-start}.it:first-of-type{border-top:0}
.tag{background:#FFF7ED;color:#C2410C;border-radius:8px;padding:2px 8px;font-size:11.5px;white-space:nowrap;font-weight:700}
.tag.b{background:#EFF6FF;color:#1D4ED8}.dt{color:var(--sub);font-size:12px;white-space:nowrap;margin-left:auto}
.best{background:linear-gradient(135deg,#FFF7ED,#FFEDD5);border:1px solid #FDBA74;border-radius:14px;padding:12px 14px;margin-top:10px;font-weight:800;color:#9A3412;text-align:center}
.wait{color:var(--sub);font-size:13px;text-align:center;padding:14px 0}
.foot{font-size:11.5px;color:#94A3B8;text-align:center;margin-top:14px;line-height:1.6}
</style></head><body>
<div class="tb">시험본 · 안전 참여 현황</div>

>
<main>
  <div class="hero"><div class="l">무재해</div><div class="n" id="days">-</div><div class="l">2015.01.02 개업 이후 재해 0건</div></div>
  <div class="kp"><div class="k"><div class="v" id="kJoin">-</div><div class="t">이번 달 참여<br>(공지·TBM 읽고 확인)</div></div>
    <div class="k"><div class="v" id="kTbm">-</div><div class="t">이번 달<br>TBM 실시율</div></div>
    <div class="k"><div class="v" id="kPr">-</div><div class="t">이번 달<br>안전 칭찬</div></div></div>
  <div id="bestBox"></div>
  <div class="sec"><h3>📈 전 직원 참여 추이 <small id="trendT">최근 8주 · 주별 참여 수</small></h3><div id="trend"><div class="wait">불러오는 중…</div></div></div>
  <div class="sec"><h3>⭐ 최근 안전 칭찬</h3><div id="recent"><div class="wait">불러오는 중…</div></div></div>
  <div class="sec"><h3>🎁 지급 내역 <small>상품권 지급 완료</small></h3><div id="pays"><div class="wait">불러오는 중…</div></div></div>
  <div class="foot">※ 직원 이름과 팀은 표시하지 않습니다<br>참여 = 직원이 매일 안전 전달사항이나 TBM 주제를 읽고 확인한 횟수<br>업데이트 <span id="upd">-</span></div>
</main>
<script>
const ENDPOINT = 'https://script.google.com/macros/s/AKfycbyk3NwZ25Kdqh1wdc2jvldoyZyuHNU3ebPPFxOh4UYn6TvLj6Fi_ZGpWgEz3b5yf0na/exec';
const NO_ACCIDENT_SINCE = '2015-01-02';
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const num = v => Number(v || 0).toLocaleString('ko-KR');
const kst = () => new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Seoul' }));
const now = kst(), ymd = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
$('days').textContent = num(Math.round((new Date(ymd + 'T00:00:00') - new Date(NO_ACCIDENT_SINCE + 'T00:00:00')) / 864e5) + 1) + '일';
$('mon').textContent = (now.getMonth() + 1) + '월';
function trend(w) {
  const W = 320, H = 120, L = 24, R = 10, T = 16, B = 20, n = w.length, mx = Math.max(10, ...w.map(x => x.n));
  const X = i => L + i * (W - L - R) / (n - 1), Y = v => T + (1 - v / mx) * (H - T - B);
  const p = w.map((x, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(x.n).toFixed(1)).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="최근 8주 참여 추이">
    <path d="${p} L${X(n - 1)} ${Y(0)} L${X(0)} ${Y(0)}Z" fill="#EA580C" opacity=".1"/><path d="${p}" fill="none" stroke="#EA580C" stroke-width="2.4"/>
    ${w.map((x, i) => `<circle cx="${X(i)}" cy="${Y(x.n)}" r="${i === n - 1 ? 4 : 2.6}" fill="#EA580C" stroke="#fff"/><text x="${X(i)}" y="${Y(x.n) - 7}" text-anchor="middle" font-size="9.5" fill="#9A3412">${x.n}</text>
    <text x="${X(i)}" y="${H - 5}" text-anchor="middle" font-size="9" fill="#64748B">${+x.to.slice(5, 7)}/${+x.to.slice(8)}</text>`).join('')}</svg>`;
}
(async () => {
  try {
    const d = await (await fetch(`${ENDPOINT}?action=pubsum`)).json(); if (!d.ok) throw new Error(d.error);
    $('kJoin').textContent = num(d.join) + '회'; $('kTbm').textContent = d.tbmRate == null ? '-' : d.tbmRate + '%'; $('kPr').textContent = num(d.praise) + '건';
    if (d.best) $('bestBox').innerHTML = `<div class="best">🏆 ${esc(d.best.replace('-', ' '))} 안전 우수사원 선정 · 특별포상</div>`;
    if (d.weeks.length >= 3) $('trend').innerHTML = trend(d.weeks);
    else if (d.daily.length >= 2) { $('trendT').textContent = '이벤트 시작 후 · 일별 참여 수'; $('trend').innerHTML = trend(d.daily.map(x => ({ n: x.n, to: x.d }))); }
    else $('trend').innerHTML = `<div class="wait">오늘 참여 ${num((d.daily[0] || {}).n)}회 · 그래프는 이틀째부터 표시됩니다</div>`;
    $('recent').innerHTML = d.recent.length ? d.recent.map(x => `<div class="it"><span class="tag">${esc(x.cat)}</span><div>${esc(x.why)}</div><span class="dt">${esc(x.date)}</span></div>`).join('') : '<div class="wait">아직 칭찬이 없습니다</div>';
    $('pays').innerHTML = d.pays.length ? d.pays.map(x => `<div class="it"><span class="tag ${x.kind === '행운' ? 'b' : ''}">${x.kind}</span><div>${x.kind === '행운' ? '당첨번호 ' + esc(x.what) : esc(x.what)} · 지급 완료</div><span class="dt">${esc(x.date)}</span></div>`).join('') : '<div class="wait">아직 지급 내역이 없습니다</div>';
    $('upd').textContent = new Date().toLocaleString('ko-KR', { timeZone: 'Asia/Seoul' });
  } catch (e) { ['trend', 'recent', 'pays'].forEach(id => $(id).innerHTML = '<div class="wait">잠시 후 다시 열어 주세요</div>'); }
})();
</script></body></html>
