<title>현장 점검 통합관리 | ㈜엠솔루션</title>
<style>
  @page{size:A4;margin:11mm}
  :root{--navy:#1E293B;--ink:#0F172A;--brand:#1B3A6B;--bg:#F8FAFC;--line:#E2E8F0;--line2:#CBD5E1;--sub:#64748B;--blue:#2563EB;--orange:#EA580C;--ok:#1D4ED8;--bad:#C2410C}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Malgun Gothic","맑은 고딕",system-ui,sans-serif;font-size:14px}
  a{color:inherit}
  button{font:inherit;cursor:pointer}
  .wrap{max-width:1100px;margin:0 auto;padding:0 16px 40px}
  header{background:var(--navy);color:#fff}
  header .wrap{display:flex;align-items:center;gap:14px;padding-top:14px;padding-bottom:14px}
  header .logo{background:#fff;border-radius:8px;padding:5px 8px;display:flex}
  header .logo img{height:26px}
  header h1{font-size:18px;margin:0;flex:1}
  header h1 small{display:block;font-size:12px;font-weight:400;color:#CBD5E1;margin-top:2px}
  header .today{font-size:13px;color:#CBD5E1}
  .lock{max-width:360px;margin:60px auto;background:#fff;border:1px solid var(--line);border-radius:14px;padding:24px;text-align:center}
  .lock input{font:inherit;font-size:20px;letter-spacing:6px;text-align:center;width:100%;padding:10px;border:1px solid var(--line2);border-radius:10px;margin:12px 0}
  .btn{border:0;border-radius:9px;padding:10px 16px;font-weight:700;background:var(--brand);color:#fff}
  .btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line2)}
  .btn.orange{background:var(--orange)}
  .btn.sm{padding:6px 10px;font-size:13px}
  .err{color:var(--bad);font-size:13px;min-height:18px;margin:6px 0 0}
  h3{font-size:15px;margin:22px 0 10px;color:var(--navy)}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:18px}
  .kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;border-top:4px solid var(--blue)}
  .kpi.warn{border-top-color:var(--orange)}
  .kpi .k{font-size:12.5px;color:var(--sub)}
  .kpi .v{font-size:26px;font-weight:800;margin-top:4px}
  .kpi .v small{font-size:14px;font-weight:600;color:var(--sub)}
  .kpi .d{font-size:12px;color:var(--sub);margin-top:4px;line-height:1.5}
  .folders{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
  .folder{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px}
  .folder.off{opacity:.55}
  .folder .top{display:flex;align-items:center;gap:10px}
  .folder .ic{width:38px;height:38px;border-radius:10px;background:#EFF6FF;display:grid;place-items:center;flex:none}
  .folder .ic svg{width:22px;height:22px;stroke:var(--brand)}
  .folder b{font-size:15px}
  .folder .no{font-size:11.5px;color:var(--sub)}
  .folder .st{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--bg);border-radius:9px;padding:8px;text-align:center}
  .folder .st div{font-size:11.5px;color:var(--sub)}
  .folder .st strong{display:block;font-size:16px;color:var(--ink)}
  .folder .st .red strong{color:var(--bad)}
  .folder .last{font-size:12px;color:var(--sub)}
  .folder .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
  .links{display:flex;gap:8px;flex-wrap:wrap}
  .links a{background:#fff;border:1px solid var(--line);border-radius:9px;padding:8px 12px;text-decoration:none;font-size:13px}
  .tabs{display:flex;gap:6px;margin:18px 0 12px;flex-wrap:wrap}
  .tabs button{border:1px solid var(--line2);background:#fff;border-radius:999px;padding:8px 14px;font-weight:700}
  .tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  .tool{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .tool input,.tool select{font:inherit;padding:8px;border:1px solid var(--line2);border-radius:8px;background:#fff}
  .tool .sp{flex:1}
  .quick button{border:1px solid var(--line2);background:var(--bg);border-radius:7px;padding:6px 9px;font-size:12.5px}
  .sum{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0}
  .sum div{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:12px;color:var(--sub)}
  .sum strong{display:block;font-size:20px;color:var(--ink)}
  .sum .red strong{color:var(--bad)}
  table{width:100%;border-collapse:collapse;font-size:12.5px;background:#fff}
  th,td{border:1px solid var(--line2);padding:6px 7px;vertical-align:middle}
  th{background:var(--navy);color:#fff;font-weight:700}
  tfoot td{background:#E2E8F0;font-weight:800}
  .c{text-align:center} .n{text-align:right}
  .O{color:var(--ok);font-weight:700} .X{color:var(--bad);font-weight:700;background:#FFF1E8} .NA,.\-{color:var(--sub)}
  .pill{display:inline-block;border-radius:999px;padding:2px 8px;font-size:11.5px;font-weight:700}
  .pill.open{background:#FFEDD5;color:var(--bad)} .pill.done{background:#DBEAFE;color:var(--ok)}
  .empty{text-align:center;color:var(--sub);padding:30px}
  .row-link{cursor:pointer} .row-link:hover td{background:#F1F5F9}
  /* 인쇄용 문서 */
  .doc{background:#fff;border:1px solid var(--line);padding:18px 20px;margin-top:14px}
  .doc .hd{display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid var(--brand);padding-bottom:8px}
  .doc .hd img{height:30px} .doc .hd .r{text-align:right;font-size:12px;color:var(--sub)}
  .doc h2{margin:10px 0 8px;font-size:19px;text-align:center}
  .doc .meta th{background:#F1F5F9;color:var(--ink);width:15%}
  .doc .g{background:#F8FAFC;font-weight:700;text-align:center;width:13%}
  .doc .sign img{height:50px}
  .doc .foot{margin-top:8px;font-size:11px;color:var(--sub)}
  #details .doc{page-break-before:always}
  .hide{display:none!important}
  @media (max-width:760px){.kpis,.sum{grid-template-columns:repeat(2,1fr)} header .today{display:none}}
  @media print{
    body{background:#fff} header,.tabs,.tool,.sum,.noprint,#home{display:none!important}
    .wrap{max-width:none;padding:0}
    .doc{border:0;margin:0;padding:0}
    body.p-list #details{display:none}
    body.p-detail #listDoc{display:none}
    body.p-detail #details .doc:first-child{page-break-before:auto}
    th{-webkit-print-color-adjust:exact;print-color-adjust:exact}
    .X,tfoot td,.pill{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  }
</style>
</head>

  const d = await (await fetch(`${ENDPOINT}?${q}&pin=${encodeURIComponent(PIN)}`)).json();
  if (!d.ok) throw new Error(d.error || '불러오기 실패');
  return d;
}

async function start() {
  if (!PIN) return showLock();
  try { SUM = await api('action=summary'); } catch (e) { return showLock(e.message); }
  try { sessionStorage.setItem('ms_pin', PIN); } catch (e) {}
  $('lock').classList.add('hide');
  route();
}
function showLock(msg) {
  ['home', 'folder'].forEach(id => $(id).classList.add('hide'));
  $('lock').classList.remove('hide'); $('lockErr').textContent = msg || ''; $('pin').focus();
}
$('enter').onclick = () => { PIN = $('pin').value.trim(); start(); };
$('pin').onkeydown = e => { if (e.key === 'Enter') $('enter').click(); };
window.onhashchange = () => SUM && route();

function route() {
  const key = location.hash.slice(1);
  if (['dust', 'patrol', '5s'].indexOf(key) >= 0) return openFolder(key);
  $('folder').classList.add('hide'); $('home').classList.remove('hide');
  renderHome();
}

function daysSince(s) { return s ? Math.floor((new Date(ymd(new Date())) - new Date(s.slice(0, 10))) / 864e5) : null; }

function renderHome() {
  const T = SUM.types, n = TEAMS.length;
  const dustLines = SUM.equipments.map(eq => {
    const d = daysSince(T.dust.lastBy[eq]);
    return { eq, d, txt: d == null ? '기록 없음' : (d === 0 ? '오늘' : `${d}일 전`) };
  });
  const dustWarn = dustLines.some(x => x.d == null || x.d >= SUM.cycle);
  const PR = SUM.patrolRoles || {};
  const both = TEAMS.filter(t => PR[t] && PR[t]['안전관리자'] && PR[t]['안전보건관리책임자']).length;
  const pDone = both, fDone = T['5s'].todayTeams.length;
  $('kpis').innerHTML = `
    <div class="kpi ${pDone < n ? 'warn' : ''}"><div class="k">오늘 순회점검 (관리자·책임자 모두)</div><div class="v">${pDone}<small> / ${n}팀</small></div>
      <div class="d">안전관리자 ${TEAMS.filter(t => PR[t] && PR[t]['안전관리자']).length}팀 · 안전보건관리책임자 ${TEAMS.filter(t => PR[t] && PR[t]['안전보건관리책임자']).length}팀</div></div>
    <div class="kpi ${fDone < n ? 'warn' : ''}"><div class="k">오늘 3정5행</div><div class="v">${fDone}<small> / ${n}팀</small></div>
      <div class="d">${TEAMS.filter(t => T['5s'].todayTeams.indexOf(t) < 0).map(t => '미실시 ' + t).join(' · ') || '전 팀 완료'}</div></div>
    <div class="kpi ${SUM.open ? 'warn' : ''}"><div class="k">미조치 불량</div><div class="v">${num(SUM.open)}<small> 건</small></div>
      <div class="d">순회점검 ${num(SUM.openBy.patrol)}건 · 3정5행 ${num(SUM.openBy['5s'])}건</div></div>
    <div class="kpi ${dustWarn ? 'warn' : ''}"><div class="k">집진기 마지막 청소 (주기 ${SUM.cycle}일)</div>
      <div class="d" style="font-size:14px;color:var(--ink);margin-top:8px">${dustLines.map(x => `${esc(x.eq)} · <b style="color:${x.d == null || x.d >= SUM.cycle ? 'var(--bad)' : 'var(--ok)'}">${x.txt}</b>`).join('<br>')}</div></div>`;
  const cell = v => v ? `<td class="c" style="color:var(--ok);font-weight:700">✔ ${esc(v)}</td>` : `<td class="c" style="color:var(--bad);background:#FFF7ED">미실시</td>`;
  $('todayTbl').innerHTML = `<table><thead><tr><th style="width:16%">팀</th><th>순회점검 · 안전관리자</th><th>순회점검 · 안전보건관리책임자</th><th>3정5행</th></tr></thead><tbody>
    ${TEAMS.map(t => { const x = PR[t] || {}; const etc = (x['기타'] || []).join(', ');
      return `<tr><td class="c"><b>${t}</b></td>${cell(x['안전관리자'])}${cell(x['안전보건관리책임자'])}${cell(T['5s'].todayTeams.indexOf(t) >= 0 ? '완료' : '')}</tr>${etc ? `<tr><td></td><td colspan="3" style="font-size:12px;color:var(--sub)">기타 점검자: ${esc(etc)}</td></tr>` : ''}`; }).join('')}
    </tbody><tfoot><tr><td class="c">합계</td><td class="c">${TEAMS.filter(t => PR[t] && PR[t]['안전관리자']).length} / ${n}팀</td><td class="c">${TEAMS.filter(t => PR[t] && PR[t]['안전보건관리책임자']).length} / ${n}팀</td><td class="c">${fDone} / ${n}팀</td></tr></tfoot></table>`;
  $('folders').innerHTML = FOLDERS.map(f => {
    const t = T[f.key];
    const open = f.key === 'dust' ? null : (SUM.openBy[f.key] || 0);
    return `<div class="folder ${f.off ? 'off' : ''}">
      <div class="top"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICON[f.key]}</svg></div>
        <div><b>${f.name}</b><div class="no">${f.no}</div></div></div>
      ${t ? `<div class="st"><div>이번 달<strong>${num(t.month)}건</strong></div><div>누적<strong>${num(t.total)}건</strong></div>
        ${open == null ? `<div>설비<strong>${SUM.equipments.length}대</strong></div>` : `<div class="${open ? 'red' : ''}">미조치<strong>${num(open)}건</strong></div>`}</div>
        <div class="last">최근 기록 · ${t.last || '없음'}</div>
        <div class="acts"><a class="btn sm" href="#${f.key}" style="text-decoration:none">기록 보기 · 출력</a></div>`
      : `<div class="last">다음 단계에서 추가 예정</div>`}
    </div>`;
  }).join('');
  $('links').innerHTML = [
    ['QR 라벨 인쇄 (팀별)', 'l.html'], ['QR 라벨 인쇄 (집진기)', 'qr.html'],
    ['원본 시트 · 순회점검/3정5행/조치관리', SUM.sheets.hub], ['원본 시트 · 집진기', SUM.sheets.dust],
    ['점검 화면 · 조립1팀', 'p.html?t=1'], ['점검 화면 · 집진기 KA4', './?eq=1']
  ].map(([t, u]) => `<a href="${esc(u)}" target="_blank" rel="noopener">${t}</a>`).join('');
}

/* ---------- 폴더(기록 조회·출력) ---------- */
let CUR = '';
function openFolder(key) {
  $('home').classList.add('hide'); $('folder').classList.remove('hide');
  $('tabs').innerHTML = `<button data-k="">← 처음 화면</button>` +
    FOLDERS.filter(f => !f.off).map(f => `<button data-k="${f.key}" class="${f.key === key ? 'on' : ''}">${f.name}</button>`).join('');
  $('tabs').querySelectorAll('button').forEach(b => b.onclick = () => { location.hash = b.dataset.k; });
  if (CUR !== key) {
    CUR = key;
    const opts = key === 'dust' ? SUM.equipments : TEAMS;
    $('area').innerHTML = `<option value="">${key === 'dust' ? '전체 설비' : '전체 팀'}</option>` + opts.map(o => `<option>${esc(o)}</option>`).join('');
    if (!$('from').value) quick('month');
    load();
  }
}
function quick(q) {
  const now = new Date(ymd(new Date()) + 'T00:00:00');
  let f = new Date(now), t = new Date(now);
  if (q === 'week') f.setDate(now.getDate() - ((now.getDay() + 6) % 7));
  if (q === 'month') f.setDate(1);
  if (q === 'prev') { f = new Date(now.getFullYear(), now.getMonth() - 1, 1); t = new Date(now.getFullYear(), now.getMonth(), 0); }
  const s = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  $('from').value = s(f); $('to').value = s(t);
}
document.querySelectorAll('.quick button').forEach(b => b.onclick = () => { quick(b.dataset.q); load(); });
$('load').onclick = load;
$('area').onchange = load;

async function load() {
  $('err').textContent = '불러오는 중…'; $('sum').innerHTML = ''; $('listDoc').innerHTML = ''; $('details').innerHTML = '';
  try {
    DATA = await api(`action=report&type=${CUR}&from=${$('from').value}&to=${$('to').value}&area=${encodeURIComponent($('area').value)}`);
    $('err').textContent = '';
    render();
  } catch (e) { $('err').textContent = e.message; }
}

function periodText() { return DATA.from === DATA.to ? DATA.from : `${DATA.from} ~ ${DATA.to}`; }

function render() {
  const rs = DATA.records, dust = DATA.type === 'dust';
  const bad = rs.reduce((s, r) => s + Number(r.bad || 0), 0);
  const acts = dust ? [] : rs.flatMap(r => r.actions || []);
  const open = acts.filter(a => a.status === '미조치').length;
  const people = new Set(rs.map(r => r.inspector)).size;
  $('sum').innerHTML = `<div>조회 건수<strong>${num(rs.length)}건</strong></div>
    <div class="${bad ? 'red' : ''}">${dust ? '이상 있음' : '불량 항목'}<strong>${num(bad)}건</strong></div>
    <div class="${open ? 'red' : ''}">${dust ? '관리감독자 확인' : '미조치'}<strong>${dust ? num(rs.filter(r => r.confirm).length) + '건' : num(open) + '건'}</strong></div>
    <div>점검자<strong>${num(people)}명</strong></div>`;
  if (!rs.length) { $('listDoc').innerHTML = '<div class="doc"><p class="empty">해당 기간에 기록이 없습니다.</p></div>'; return; }

  const head = dust
    ? '<th style="width:5%">No</th><th style="width:15%">점검일시</th><th>설비</th><th>작업자</th><th style="width:9%">체크</th><th>특이사항·메모</th><th style="width:15%">관리감독자 확인</th>'
    : '<th style="width:5%">No</th><th style="width:15%">점검일시</th><th style="width:9%">팀</th><th style="width:13%">점검자</th><th style="width:6%">양호</th><th style="width:6%">불량</th><th>불량 내용</th><th style="width:10%">조치</th>';
  const body = rs.map((r, i) => {
    if (dust) return `<tr class="row-link" data-i="${i}"><td class="c">${i + 1}</td><td class="c">${esc(r.time)}</td><td class="c">${esc(r.area)}</td><td class="c">${esc(r.inspector)}</td>
      <td class="c">${r.ok}/${r.total}</td><td class="${r.bad ? 'X' : ''}">${r.bad ? '이상 있음 · ' : ''}${esc(r.memo)}</td><td class="c">${esc(r.confirm || '-')}</td></tr>`;
    const a = r.actions || [], o = a.filter(x => x.status === '미조치').length;
    return `<tr class="row-link" data-i="${i}"><td class="c">${i + 1}</td><td class="c">${esc(r.time)}</td><td class="c">${esc(r.area)}</td><td class="c">${esc(r.inspector)}${r.role && r.role !== '기타' ? `<div style="font-size:11px;color:var(--sub)">${esc(r.role)}</div>` : ''}</td>
      <td class="n">${num(r.ok)}</td><td class="n ${r.bad ? 'X' : ''}">${num(r.bad)}</td><td>${esc(r.badText)}</td>
      <td class="c">${a.length ? (o ? `<span class="pill open">미조치 ${o}</span>` : '<span class="pill done">완료</span>') : '-'}</td></tr>`;
  }).join('');
  const foot = dust
    ? `<tr><td colspan="4" class="c">합계 ${num(rs.length)}건</td><td class="c">평균 ${(rs.reduce((s, r) => s + r.ok, 0) / rs.length).toFixed(1)}</td><td>이상 있음 ${num(bad)}건</td><td class="c">확인 ${num(rs.filter(r => r.confirm).length)}건</td></tr>`
    : `<tr><td colspan="4" class="c">합계 ${num(rs.length)}건</td><td class="n">${num(rs.reduce((s, r) => s + Number(r.ok || 0), 0))}</td><td class="n">${num(bad)}</td><td>조치 대상 ${num(acts.length)}건</td><td class="c">미조치 ${num(open)}</td></tr>`;
  $('listDoc').innerHTML = `<div class="doc">${docHead()}
    <h2>${esc(DATA.name)} 기록 대장</h2>
    <table class="meta"><tr><th>사업장명</th><td>㈜엠솔루션</td><th>조회 기간</th><td>${periodText()}</td></tr>
      <tr><th>대상</th><td>${esc(DATA.area || (dust ? '전체 설비' : '전체 팀'))}</td><th>건수</th><td>${num(rs.length)}건</td></tr></table>
    <div style="height:8px"></div>
    <table><thead><tr>${head}</tr></thead><tbody>${body}</tbody><tfoot>${foot}</tfoot></table>
    ${dust ? '' : actionTable(rs)}
    ${docFoot()}</div>`;
  const grps = detailGroups(rs);
  $('details').innerHTML = grps.map(g => g.length > 1 ? detailMerged(g) : detail(g[0])).join('');
  $('listDoc').querySelectorAll('.row-link').forEach(tr => tr.onclick = () => {
    const gi = grps.findIndex(g => g.indexOf(rs[tr.dataset.i]) >= 0);
    const el = $('details').children[gi]; if (el) el.scrollIntoView({ behavior: 'smooth' });
  });
}

function actionTable(rs) {
  const rows = rs.flatMap(r => (r.actions || []).map(a => ({ ...a, time: r.time, area: r.area })));
  if (!rows.length) return '';
  return `<h3 style="margin:14px 0 6px;font-size:14px">불량 조치 이력</h3>
    <table><thead><tr><th style="width:15%">발견일시</th><th style="width:9%">팀</th><th>항목 · 불량 내용</th><th>조치 내용</th><th style="width:9%">조치자</th><th style="width:11%">완료일</th><th style="width:8%">상태</th></tr></thead>
    <tbody>${rows.map(a => `<tr><td class="c">${esc(a.time)}</td><td class="c">${esc(a.area)}</td><td>${esc(a.label)} — ${esc(a.note)}</td><td>${esc(a.action)}</td><td class="c">${esc(a.by)}</td><td class="c">${esc(a.date)}</td>
      <td class="c"><span class="pill ${a.status === '완료' ? 'done' : 'open'}">${esc(a.status)}</span></td></tr>`).join('')}</tbody></table>`;
}

function docHead() { return `<div class="hd"><img src="${LOGO}" alt="㈜엠솔루션"><div class="r">안전보건팀<br>${esc(DATA.docno)}</div></div>`; }
function docFoot() { return `<div class="foot">※ QR 전자 점검기록(제출 시각 서버 자동 기록${DATA.type === 'patrol' ? ', 점검자 전자서명' : ''})을 출력한 문서이며 원본은 회사 구글 시트에 보관됨 · 출력일시 ${new Date().toLocaleString('ko-KR')}</div>`; }

const ROLE_ORDER = { '안전관리자': 0, '안전보건관리책임자': 1 };
const ROLE_SHORT = { '안전관리자': '관리자', '안전보건관리책임자': '책임자' };
function detailGroups(rs) {
  if (DATA.type !== 'patrol') return rs.map(r => [r]);
  const m = new Map();
  rs.forEach(r => { const k = r.time.slice(0, 10) + '|' + r.area; if (!m.has(k)) m.set(k, []); m.get(k).push(r); });
  return [...m.values()].map(g => g.sort((a, b) => (ROLE_ORDER[a.role] ?? 9) - (ROLE_ORDER[b.role] ?? 9) || a.time.localeCompare(b.time)));
}
// 같은 날·같은 팀 순회점검 여러 건 → 1장 (점검자별 결과 칸 + 서명 나란히)
function detailMerged(grp) {
  const head = grp.map(r => ROLE_SHORT[r.role] || r.inspector);
  const rows = [];
  grp.forEach((r, ri) => r.items.forEach(it => {
    const k = it.id || it.label;
    let row = rows.find(x => x.k === k);
    if (!row) rows.push(row = { k, g: it.g, label: it.label, res: [], notes: [] });
    row.res[ri] = it.r;
    if (it.note) row.notes.push(`${head[ri]}: ${it.note}`);
  }));
  const groups = [];
  rows.forEach(x => { let g = groups.find(y => y.g === x.g); if (!g) groups.push(g = { g: x.g, rows: [] }); g.rows.push(x); });
  const etcOf = g => grp.map((r, ri) => r.etc && r.etc[g] ? `${head[ri]}: ${r.etc[g]}` : '').filter(Boolean).join(' / ');
  const body = groups.map(g => {
    const etc = etcOf(g.g), extra = etc ? 1 : 0;
    return g.rows.map((x, i) => `<tr>${i === 0 ? `<td class="g" rowspan="${g.rows.length + extra}">${esc(g.g)}</td>` : ''}<td>${esc(x.label)}</td>
      ${grp.map((r, ri) => `<td class="c ${x.res[ri] || ''}">${R[x.res[ri]] || '-'}</td>`).join('')}<td>${esc(x.notes.join(' / '))}</td></tr>`).join('') +
      (extra ? `<tr><td>기타</td>${grp.map(() => '<td class="c">-</td>').join('')}<td>${esc(etc)}</td></tr>` : '');
  }).join('');
  const seen = {}, acts = grp.flatMap(r => r.actions || []).filter(a => { const k = a.label + '|' + a.note; return seen[k] ? false : (seen[k] = 1); });
  const actTable = acts.length ? `<div style="height:8px"></div><table><tr><th>불량 항목</th><th>조치 내용</th><th style="width:12%">조치자</th><th style="width:13%">완료일</th><th style="width:9%">상태</th></tr>
    ${acts.map(a => `<tr><td>${esc(a.label)}</td><td>${esc(a.action)}</td><td class="c">${esc(a.by)}</td><td class="c">${esc(a.date)}</td><td class="c">${esc(a.status)}</td></tr>`).join('')}</table>` : '';
  const w = Math.max(7, Math.floor(30 / grp.length));
  return `<div class="doc">${docHead()}
    <h2>중대재해예방 일일 점검 체크리스트</h2>
    <table class="meta"><tr><th>사업장명</th><td>㈜엠솔루션</td><th>점검 구역</th><td>${esc(grp[0].area)}</td></tr>
      <tr><th>점검 일자</th><td colspan="3">${esc(grp[0].time.slice(0, 10))}</td></tr>
      <tr>${grp.map(r => `<th>${esc(r.role && r.role !== '기타' ? r.role : '점검자')}</th><td>${esc(r.inspector)} · ${esc(r.time.slice(11))}${r.sign ? `<div class="sign"><img src="${r.sign}" alt="서명"></div>` : ''}</td>`).join('')}</tr></table>
    <div style="height:8px"></div>
    <table><tr><th>구분</th><th>점검사항</th>${head.map(h => `<th style="width:${w}%">${esc(h)}</th>`).join('')}<th style="width:26%">비고 (불량 내용)</th></tr>${body}</table>
    ${actTable}${docFoot()}</div>`;
}

function detail(r) {
  const groups = [];
  r.items.forEach(it => { let g = groups.find(x => x.g === it.g); if (!g) groups.push(g = { g: it.g, items: [] }); g.items.push(it); });
  const body = groups.map(g => {
    const extra = r.etc && r.etc[g.g] ? 1 : 0;
    return g.items.map((it, i) => `<tr>${i === 0 ? `<td class="g" rowspan="${g.items.length + extra}">${esc(g.g)}</td>` : ''}
      <td>${esc(it.label)}</td><td class="c ${it.r === '-' ? '' : it.r}">${R[it.r] || ''}</td><td>${esc(it.note)}</td></tr>`).join('') +
      (extra ? `<tr><td>기타</td><td class="c">-</td><td>${esc(r.etc[g.g])}</td></tr>` : '');
  }).join('');
  const dust = DATA.type === 'dust';
  const extraRows = dust ? `<tr><th>특이사항</th><td class="${r.bad ? 'X' : ''}">${r.bad ? '이상 있음' : '없음'}</td><th>관리감독자 확인</th><td>${esc(r.confirm || '-')}</td></tr>
    ${r.memo ? `<tr><th>메모</th><td colspan="3">${esc(r.memo)}</td></tr>` : ''}` : '';
  const acts = (r.actions || []).length ? `<div style="height:8px"></div><table><tr><th>불량 항목</th><th>조치 내용</th><th style="width:12%">조치자</th><th style="width:13%">완료일</th><th style="width:9%">상태</th></tr>
    ${r.actions.map(a => `<tr><td>${esc(a.label)}</td><td>${esc(a.action)}</td><td class="c">${esc(a.by)}</td><td class="c">${esc(a.date)}</td><td class="c">${esc(a.status)}</td></tr>`).join('')}</table>` : '';
  return `<div class="doc">${docHead()}
    <h2>${DATA.type === 'patrol' ? '중대재해예방 일일 점검 체크리스트' : esc(DATA.name) + '표'}</h2>
    <table class="meta"><tr><th>사업장명</th><td>㈜엠솔루션</td><th>${dust ? '설비' : '점검 구역'}</th><td>${esc(r.area)}</td></tr>
      <tr><th>점검 일시</th><td>${esc(r.time)}</td><th>${dust ? '작업자' : '점검자'}</th><td>${esc(r.inspector)}${r.role && r.role !== '기타' ? ` (${esc(r.role)})` : ''}${r.sign ? `<div class="sign"><img src="${r.sign}" alt="서명"></div>` : ''}</td></tr>${extraRows}</table>
    <div style="height:8px"></div>
    <table><tr><th>구분</th><th>점검사항</th><th style="width:10%">결과</th><th style="width:30%">비고 (불량 내용)</th></tr>${body}</table>
    ${acts}${docFoot()}</div>`;
}

document.querySelectorAll('[data-print]').forEach(b => b.onclick = () => {
  if (!DATA || !DATA.records.length) return $('err').textContent = '먼저 조회해 주세요.';
  document.body.className = b.dataset.print === 'list' ? 'p-list' : b.dataset.print === 'detail' ? 'p-detail' : '';
  print();
});
window.onafterprint = () => { document.body.className = ''; };
start();
</script>
</body>
</html>
